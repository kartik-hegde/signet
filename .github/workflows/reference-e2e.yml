name: Reference E2E

on:
  pull_request:
    paths:
      - ".github/workflows/reference-e2e.yml"
      - "examples/cypress-realworld-app/**"
      - "src/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/reference-e2e.yml"
      - "examples/cypress-realworld-app/**"
      - "src/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-e2e:
    name: Cypress reference app (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:reference:install
      - run: npm run test:reference
      - name: Upload comparison and Cypress diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reference-e2e-results
          if-no-files-found: ignore
          path: |
            examples/cypress-realworld-app/cypress/results/
            examples/cypress-realworld-app/cypress/screenshots/
            examples/cypress-realworld-app/cypress/videos/
