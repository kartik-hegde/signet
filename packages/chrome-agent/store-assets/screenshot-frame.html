<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signett Agent store screenshot</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 410px;
        background: #11110f;
      }
      iframe {
        width: 100%;
        height: 100%;
        border: 0;
      }
      .panel {
        border-left: 1px solid #d9d7d0;
        background: #f7f6f2;
        box-shadow: -18px 0 48px #0004;
      }
    </style>
  </head>
  <body>
    <iframe src="http://127.0.0.1:4174/" title="WebMCP demo store"></iframe>
    <iframe
      class="panel"
      id="agent-panel"
      src="../sidepanel.html"
      title="Signett Agent side panel"
    ></iframe>
    <script>
      document
        .querySelector("#agent-panel")
        .addEventListener("load", (event) => {
          const panel = event.currentTarget.contentDocument;
          panel.querySelector("#tool-count").textContent = "3";
          panel.querySelector("#tools-state").textContent = "Updated now";
        });
    </script>
  </body>
</html>
