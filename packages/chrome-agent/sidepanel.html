<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signet Agent</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="app-header">
      <button class="text-button" id="new-run-button" hidden>New</button>
      <button
        class="icon-button"
        id="settings-button"
        title="Settings"
        aria-label="Open settings"
      >
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3" />
          <path
            d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.37a1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.63 15 1.7 1.7 0 0 0 3.09 14H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.63 9a1.7 1.7 0 0 0-.34-1.88l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.63h.01A1.7 1.7 0 0 0 10 3.09V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.54 1.7 1.7 0 0 0 1.88-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.37 9v.01A1.7 1.7 0 0 0 20.91 10H21a2 2 0 1 1 0 4h-.09A1.7 1.7 0 0 0 19.4 15Z"
          />
        </svg>
      </button>
    </header>

    <main id="main-view">
      <section class="workspace">
        <div class="hero" id="hero">
          <h1>What do you want to do today?</h1>
        </div>

        <section
          class="conversation"
          id="conversation"
          hidden
          aria-live="polite"
        >
          <div class="prompt-message" id="prompt-message"></div>
          <div class="answer-message" id="answer-message"></div>
        </section>
      </section>

      <div class="control-dock">
        <details class="tools-disclosure" id="tools-disclosure">
          <summary>
            <span
              ><strong>Tools available</strong>
              <span class="count" id="tool-count">0</span></span
            >
            <span class="tools-actions">
              <button
                class="access-button"
                id="website-access-button"
                type="button"
                hidden
              >
                Allow website access
              </button>
              <span class="tools-state" id="tools-state" role="status"
                >Checking…</span
              >
              <button
                class="refresh-button"
                id="refresh-button"
                type="button"
                aria-label="Refresh available tools"
                title="Refresh available tools"
              >
                <svg aria-hidden="true" viewBox="0 0 24 24">
                  <path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6" />
                </svg>
              </button>
            </span>
          </summary>
          <div class="tool-list" id="tool-list">
            <p class="empty-state">No tools found.</p>
          </div>
        </details>

        <details class="trace-disclosure" id="trace-disclosure" hidden>
          <summary>
            <span
              ><strong>Run details</strong>
              <span class="count" id="call-count">0</span></span
            >
            <span id="trace-state">Running…</span>
          </summary>
          <div class="trace-list" id="trace-list"></div>
        </details>

        <form class="composer" id="prompt-form">
          <label class="sr-only" for="prompt-input">Prompt</label>
          <textarea
            id="prompt-input"
            rows="3"
            placeholder="Ask Signet to use this page…"
          ></textarea>
          <div class="composer-footer">
            <span class="run-status" id="run-status" role="status">Ready</span>
            <button class="stop-button" id="stop-button" type="button" hidden>
              Stop
            </button>
            <button
              class="run-button"
              id="run-button"
              type="submit"
              aria-label="Run agent"
              title="Run agent"
            >
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="m6 12 6-6 6 6m-6-6v13" />
              </svg>
            </button>
          </div>
        </form>
      </div>
    </main>

    <section
      class="settings-view"
      id="settings-panel"
      hidden
      aria-labelledby="settings-title"
    >
      <div class="sheet-header">
        <div>
          <p class="kicker">Connection</p>
          <h2 id="settings-title">Model settings</h2>
        </div>
        <button
          class="icon-button"
          id="close-settings-button"
          aria-label="Close settings"
          title="Close settings"
        >
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="m6 6 12 12M18 6 6 18" />
          </svg>
        </button>
      </div>

      <div class="settings-fields">
        <label
          >Provider
          <select id="provider-input">
            <option value="openai">OpenAI</option>
            <option value="gemini">Gemini</option>
            <option value="anthropic">Anthropic</option>
            <option value="demo">Local demo</option>
            <option value="custom">Custom / OpenAI-compatible</option>
          </select>
        </label>
        <label
          >Model<input id="model-input" type="text" autocomplete="off"
        /></label>
        <label class="custom-only" id="endpoint-field"
          >Endpoint<input
            id="endpoint-input"
            type="url"
            placeholder="https://provider.example/v1/chat/completions"
        /></label>
        <label
          >API key <span class="muted">kept only for this Chrome session</span>
          <input
            id="api-key-input"
            type="password"
            autocomplete="off"
            placeholder="Paste your API key"
          />
        </label>
        <label class="consent-row">
          <input id="data-consent-input" type="checkbox" />
          <span
            >Allow each run to send the prompt, tool definitions, and tool
            results directly to this provider.</span
          >
        </label>
      </div>

      <div class="sheet-actions">
        <span id="settings-status" role="status"></span>
        <button class="save-button" id="save-settings-button">Save</button>
      </div>
    </section>

    <script type="module" src="sidepanel.mjs"></script>
  </body>
</html>
